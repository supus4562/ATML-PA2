seed: 6304
base_model: Qwen/Qwen2.5-1.5B-Instruct
reward_model: yavuz-ai/qwen2.5-1.5b-rm-ultrafeedback
reward_tokenizer: Qwen/Qwen2.5-1.5B-Instruct
ai_judge_model: Qwen/Qwen2.5-3B-Instruct
value_model_init: Qwen/Qwen2.5-0.5B-Instruct

# FP16 is intentionally preferred over BF16 for DPO/RL fine-tuning.
# FP16 has 10 mantissa bits vs BF16's 7, which reduces log-probability
# drift between training and inference — critical for DPO stability.
dtype: float16

# Frozen models (reward model etc.) stay at 8-bit to save memory.
quantize_frozen_models: true

# LoRA adapter config — tuned for RTX PRO 6000 Blackwell (96 GB GDDR7).
# Rank 16 + all 7 linear layer types gives a far more expressive adapter
# than the original r=8 on [q,v] only. The 96 GB VRAM makes this free.
lora:
  r: 16
  alpha: 32          # keep 2× scaling rule: alpha = 2 * r
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# PPO critic — same lightweight adapter family used during staff preparation.
value_lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]

generation:
  temperature: 0.7
  top_p: 0.9
  do_sample: true

paths:
  dpo_standard_train: data/dpo_standard_train.jsonl
  dpo_standard_eval: data/dpo_standard_eval.jsonl
  dpo_length_train: data/dpo_length_balanced_train.jsonl
  dpo_length_eval: data/dpo_length_stratified_eval.jsonl
  word_limit_prompts: data/word_limit_prompts.jsonl
  rl_prompt_train: data/rl_prompt_pool_train.jsonl
  rl_prompt_eval: data/rl_prompt_pool_eval.jsonl
  xstest: data/xstest_safety_prompts.csv
  gsm_train: data/gsm8k_rl_train.jsonl
  gsm_eval: data/gsm8k_eval.jsonl
  math_transfer_eval: data/math_transfer_eval.jsonl
  task5_diagnostics: data/task5_controlled_reward_diagnostics.jsonl

  ppo_rollout_cache: cached/ppo_rollout.pt
  grpo_k_cache: cached/grpo_k_cache.jsonl

  ppo_midpoint_policy: checkpoints/ppo_midpoint_policy
  ppo_midpoint_value: checkpoints/ppo_midpoint_value
  grpo_midpoint_policy: checkpoints/grpo_midpoint_policy
  rlvr_policy: checkpoints/rlvr_policy
  rlaif_policy: checkpoints/rlaif_policy
